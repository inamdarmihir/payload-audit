[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qdrant-payload-audit"
version = "0.1.0"
description = "Audit a live Qdrant collection for dynamic-payload-key schema sprawl that get_collection() alone won't show you."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "Mihir Inamdar" }]
keywords = ["qdrant", "vector-database", "payload-index", "schema", "audit", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Database",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "qdrant-client==1.19.0",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/inamdarmihir/payload-audit"
Repository = "https://github.com/inamdarmihir/payload-audit"
Issues = "https://github.com/inamdarmihir/payload-audit/issues"

[project.scripts]
qdrant-payload-audit = "qdrant_payload_audit.cli:main"

[tool.setuptools]
packages = ["qdrant_payload_audit"]
